<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QuickTask</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 10L8 14L16 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">QuickTask</span>
      </div>
      <span id="current-date" class="date-badge"></span>
    </header>

    <div class="progress-section">
      <div class="progress-track">
        <div id="progress-bar" class="progress-fill"></div>
      </div>
      <div class="progress-row">
        <span id="progress-text" class="progress-label">Completed: 0 / 0</span>
        <button id="toggle-hide-btn" class="pill-btn">Hide completed</button>
      </div>
    </div>

    <div class="input-section">
      <div class="input-wrap">
        <input
          type="text"
          id="task-input"
          class="task-input"
          placeholder="What needs to be done?"
          maxlength="120"
          autocomplete="off"
        />
        <button id="add-btn" class="add-btn" title="Add task">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="list-section">
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-msg" class="empty-msg">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="empty-icon">
          <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 10h8M8 14h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M3 9h18" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        No tasks yet
      </p>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
